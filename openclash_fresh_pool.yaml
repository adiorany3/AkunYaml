mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
keep-alive-interval: 15
keep-alive-idle: 30
disable-keep-alive: false
external-controller: 127.0.0.1:9090
secret: reyre
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    QUIC:
      ports:
      - 443
      - 8443
  force-domain:
  - +.v2ex.com
  skip-domain:
  - +.lan
  - +.local
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost.ptlogin2.qq.com
  - dns.msftncsi.com
  - www.msftconnecttest.com
  - connectivitycheck.gstatic.com
  - connect.rom.miui.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - router.asus.com
  - tplinkwifi.net
  - tendawifi.com
  - +.bca.co.id
  - +.bni.co.id
  - +.bri.co.id
  - +.mandiri.co.id
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://family.dns.bebasid.com/dns-query
  - tls://family.dns.bebasid.com:853
  fallback:
  - https://family.dns.bebasid.com/dns-query
  - tls://family.dns.bebasid.com:853
  fallback-filter:
    geoip: true
    geoip-code: ID
    ipcidr:
    - 240.0.0.0/4
  cache-algorithm: arc
  fallback-lazy-query: true
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  nameserver-policy:
    +.openai.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.chatgpt.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.chatgpt.site:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.anthropic.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.claude.ai:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.claude.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.gemini.google.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
