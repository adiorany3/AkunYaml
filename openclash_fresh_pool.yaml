  - dns.msftncsi.com
  - www.msftconnecttest.com
  - connectivitycheck.gstatic.com
  - connect.rom.miui.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - router.asus.com
  - tplinkwifi.net
  - tendawifi.com
  - +.bca.co.id
  - +.bni.co.id
  - +.bri.co.id
  - +.mandiri.co.id
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - '*.n.n.srv.nintendo.net'
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  cache-algorithm: arc
  default-nameserver:
  - https://1.1.1.1/dns-query
  - https://9.9.9.9/dns-query
  nameserver:
