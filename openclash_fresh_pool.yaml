  - connect.rom.miui.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - router.asus.com
  - tplinkwifi.net
  - tendawifi.com
  - +.bca.co.id
  - +.bni.co.id
  - +.bri.co.id
  - +.mandiri.co.id
  cache-algorithm: arc
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver: &id001
  - https://family.dns.bebasid.com/dns-query
  - tls://family.dns.bebasid.com:853
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
