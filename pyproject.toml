[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akunyaml"
version = "0.1.0"
authors = [{name = "Your Name", email = "you@example.com"}]
description = "Ad‑audit suite for YAML based blocklists"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "ruff", "mypy"]

[project.scripts]
adaudit = "akunyaml.ads_audit:main"
smart-update = "smart_update_adblock:main"
