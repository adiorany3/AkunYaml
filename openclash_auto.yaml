rule-providers:
  ads_domain:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    path: ./rule_providers/ads_domain.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
  youtube_domain:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    path: ./rule_providers/youtube.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
  security-tif-mini:
    type: http
    behavior: domain
    format: text
    interval: 43200
    path: ./ruleset/security-tif-mini.txt
    url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.mini-onlydomains.txt
  popup-ads:
    type: http
    behavior: domain
    format: text
    interval: 43200
    path: ./ruleset/popup-ads.txt
    url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/popupads-onlydomains.txt
  tracker-domain:
    type: http
    behavior: domain
    format: mrs
    interval: 43200
    path: ./ruleset/tracker.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tracker.mrs
