profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    QUIC:
      ports:
      - 443
      - 8443
  force-domain:
  - +.v2ex.com
  skip-domain:
  - +.lan
  - +.local
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost.ptlogin2.qq.com
  - dns.msftncsi.com
  - www.msftconnecttest.com
  - connectivitycheck.gstatic.com
  - connect.rom.miui.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - router.asus.com
  - tplinkwifi.net
  - tendawifi.com
  - +.bca.co.id
  - +.bni.co.id
  - +.bri.co.id
  - +.mandiri.co.id
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  fallback:
  - https://family.dns.bebasid.com/dns-query
  - tls://family.dns.bebasid.com:853
  fallback-filter:
    geoip: true
    geoip-code: ID
    ipcidr:
    - 240.0.0.0/4
  cache-algorithm: arc
  fallback-lazy-query: true
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  nameserver-policy:
    +.openai.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.chatgpt.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.chatgpt.site:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.anthropic.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.claude.ai:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.claude.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.gemini.google.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
rule-providers:
  ads_domain:
    type: http
    behavior: domain
    format: mrs
    path: ./rule_providers/ads_domain.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    interval: 43200
  youtube_domain:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    path: ./rule_providers/youtube.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
  threat-tif-mini:
    type: http
    behavior: domain
    format: text
    path: ./rule_providers/threat-tif-mini.txt
    url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.mini-onlydomains.txt
    interval: 43200
  tracker-domain:
    type: http
    behavior: domain
    format: mrs
    path: ./rule_providers/tracker.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tracker.mrs
    interval: 43200
  openai_domain:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    path: ./rule_providers/openai.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.mrs
  ai_category:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    path: ./rule_providers/category-ai-not-cn.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs
  chatgpt_voice:
    type: http
    interval: 43200
    behavior: classical
    format: text
    path: ./rule_providers/chatgpt_voice.txt
    url: https://ruleset.skk.moe/Clash/ip/ai.txt
