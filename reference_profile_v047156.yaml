# Pinned routing/DNS reference for OpenClash v0.47.156 package.
# Generated from the known-good openclash_auto.yaml included in this archive.
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  force-domain:
  - +.v2ex.com
  skip-domain:
  - +.lan
  - +.local
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost.ptlogin2.qq.com
  - dns.msftncsi.com
  - www.msftconnecttest.com
  - connectivitycheck.gstatic.com
  - connect.rom.miui.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - router.asus.com
  - tplinkwifi.net
  - tendawifi.com
  - +.bca.co.id
  - +.bni.co.id
  - +.bri.co.id
  - +.mandiri.co.id
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  fallback:
  - tls://1.1.1.1
  - tls://8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: ID
    ipcidr:
    - 240.0.0.0/4
rule-providers:
  ads_domain:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    path: ./rule_providers/ads_domain.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
  youtube_domain:
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    path: ./rule_providers/youtube.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
