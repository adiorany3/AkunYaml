  - openclash_android.yaml
  - openclash_lite.yaml
  - openclash_fresh_pool.yaml

# Do NOT commit your real API key. Use environment variable OPENAI_API_KEY instead.
# OpenAI configuration removed
# Anthropic API configuration (replace with your own values)
ANTHROPIC_BASE_URL: "http://127.0.0.1:20128/v1"
ANTHROPIC_AUTH_TOKEN: "sk-95b4491cfc89a629-h5ol4y-77ce990c"
# Proxy health check settings
PROXY_HEALTH_CHECK_ENABLED: true
PROXY_HEALTH_TIMEOUT: 5  # seconds
# Enable AI‑based adblock test
ai_adblock_test_enabled: true
netflix_playback:
  - netflix.com
  - netflix.net
  - nflxvideo.net
  - nflximg.net
  - nflxso.net
  - nflxext.com

broad_media_blocks: []

audits:
